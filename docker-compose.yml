services:
  ba-request-skolehistorik:
    container_name: ba-request-skolehistorik
    # :latest følger nyeste versionstag. Vil du binde dig til en bestemt
    # udgivelse, brug :0.1.0 i stedet.
    #
    # Til rollback: peg på digesten, ikke på :sha-a1b2c3d. Bygges samme commit
    # to gange — f.eks. ved både et merge og et efterfølgende versionstag —
    # overskrives :sha-tagget med en ny digest, fordi apt- og pip-versioner
    # ikke er pinnede. Kun @sha256:... er uforanderlig:
    #   ghcr.io/hjk-automatisering/ba-request-skolehistorik@sha256:deaf9472...
    # image: 'ghcr.io/hjk-automatisering/ba-request-skolehistorik:latest' # Uncomment on portainer
    build: . # Remove on portainer
    volumes:
      # Delt med mail-client: PDF'er lægges her og refereres ved sti i POST /send
      - external-attachments:/shared
      # Kun relevant med MAILER=console: her lander PDF'erne i stedet
      - pdf-output:/data/output
    env_file:
      - .env # stack.env on portainer
    restart: on-failure
    environment:
      - TZ=Europe/Copenhagen
    networks:
      - mail-client_default

volumes:
  external-attachments:
    external: true
    name: mail-client-external-attachments
  pdf-output:

networks:
  mail-client_default:
    external: true
